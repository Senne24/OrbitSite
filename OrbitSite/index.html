<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Orbit</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #e8e8e8;
            gap: 24px;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            position: relative;
        }

        .rating-title {
            color: #111;
            padding: 0.5em 1.2em;
            font-size: 110px;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 700;
            border-radius: 0.6em;
            background: #e8e8e8;
            border: 1px solid #e8e8e8;
            text-align: center;
            margin-bottom: -10px;
            transition: opacity 1.5s ease;
        }

        .rating-title span {
            color: #c9cc30;
        }

        .btn-shine {
            position: relative;
            padding: 0 16px;
            color: #111;
            font-weight: 600;
            font-size: 24px;
            text-decoration: none;
            white-space: nowrap;
            font-family: "Poppins", system-ui, -apple-system, sans-serif;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .btn-shine.visible {
            opacity: 1;
        }

        .rating-wrapper {
            position: relative;
            display: inline-block;
            transition: opacity 1.5s ease;
        }

        .rating {
            display: inline-block;
            padding: 0.8em 1.8em;
            border-radius: 0.6em;
            background: #e8e8e8;
            border: 1px solid #e8e8e8;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .rating input {
            display: none;
        }

        .rating label {
            float: right;
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .rating label:hover {
            transform: scale(1.1);
        }

        .rating label:before {
            content: '\2605';
            font-size: 96px;
        }

        .rating input:checked ~ label,
        .rating label:hover,
        .rating label:hover ~ label {
            color: #c9cc30;
        }
    </style>
</head>
<body>

    <div class="header-container" id="headerContainer">
        <div class="rating-title" id="ratingTitle">Rate <span>Orbit</span></div>
        <div class="btn-shine" id="creditText">Thanks for the 5 stars :)</div>
    </div>

    <div class="rating-wrapper" id="ratingWrapper">
        <div class="rating" id="ratingBox">
            <input value="5" name="rating" id="star5" type="radio" autocomplete="off">
            <label for="star5"></label>
            <input value="4" name="rating" id="star4" type="radio" autocomplete="off">
            <label for="star4"></label>
            <input value="3" name="rating" id="star3" type="radio" autocomplete="off">
            <label for="star3"></label>
            <input value="2" name="rating" id="star2" type="radio" autocomplete="off">
            <label for="star2"></label>
            <input value="1" name="rating" id="star1" type="radio" autocomplete="off">
            <label for="star1"></label>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
